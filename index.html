<!DOCTYPE html>
<html>
<head>
    <title>Dodge Game</title>

    <style>
        #gameArea {
            width: 400px;
            height: 400px;
            border: 2px solid black;
            position: relative;
            overflow: hidden;
        }

        #player {
            width: 50px;
            height: 50px;
            background-color: blue;
            position: absolute;
            bottom: 10px;
            left: 175px;
        }

        .enemy {
            width: 40px;
            height: 40px;
            background-color: red;
            position: absolute;
            top: 0px;
        }
    </style>

</head>

<body>

<h1>Dodge Game</h1>

<p>Score: <span id="score">0</span></p>
<p>Lives: <span id="lives">3</span></p>

<div id="gameArea">
    <div id="player"></div>
</div>

<script src="game.js"></script>

</body>
</html>
